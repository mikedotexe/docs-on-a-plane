openapi: 3.1.0
info:
  title: "NEAR Protocol RPC: View contract state"
  description: "Fetch the raw key-value state a contract has written, optionally filtered by key prefix."
  version: 1.0.0
servers:
  - url: "https://rpc.mainnet.fastnear.com"
    description: Mainnet
  - url: "https://rpc.testnet.fastnear.com"
    description: Testnet
paths:
  /:
    post:
      operationId: view_state
      summary: View contract state
      description: "Fetch the raw key-value state a contract has written, optionally filtered by key prefix."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc, id, method, params]
              properties:
                jsonrpc:
                  type: string
                  enum: ["2.0"]
                id:
                  type: string
                  example: fastnear
                method:
                  type: string
                  enum: [query]
                params:
                  type: object
                  properties:
                    account_id:
                      type: string
                      description: NEAR account ID
                    include_proof:
                      type: boolean
                      description: Include a Merkle proof for the queried state alongside the values.
                    prefix_base64:
                      type: string
                      description: Base64-encoded storage key prefix. Use an empty string (`""`) to remove the prefix filter and return all matching contract state values. Large contracts can produce very large responses when no prefix is set.
                    request_type:
                      type: string
                      enum: [view_state]
                    finality:
                      type: string
                      enum: [final, near-final, optimistic]
                      description: Block finality
                  required: [request_type, account_id, prefix_base64, finality]
            examples:
              mainnet:
                summary: View Mainnet Contract State
                value:
                  jsonrpc: "2.0"
                  id: fastnear
                  method: query
                  params:
                    request_type: view_state
                    finality: final
                    account_id: lockup.near
                    prefix_base64: U1RBVEU=
              testnet:
                summary: View Testnet Contract State
                value:
                  jsonrpc: "2.0"
                  id: fastnear
                  method: query
                  params:
                    request_type: view_state
                    finality: final
                    account_id: v1.signer-prod.testnet
                    prefix_base64: U1RBVEU=
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse"
security:
  - ApiKeyAuth: []
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: query
      name: apiKey
  schemas:
    JsonRpcResponse:
      type: object
      required: [jsonrpc, id]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          oneOf:
            - type: string
            - type: number
        result:
          type: object
          description: Resulting state values for a view state query request
          properties:
            proof:
              type: array
              items:
                type: string
            values:
              type: array
              items:
                type: object
                description: "Item of the state, key and value are serialized in base64 and proof for inclusion of given state item."
          required: [values]
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
            data:
              type: object
