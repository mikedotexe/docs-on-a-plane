openapi: 3.0.3
info:
  title: FastNEAR API - Health
  version: 3.0.3
  description: "Ping the FastNEAR API for liveness — returns `{status: ok}` when healthy."
paths:
  /health:
    get:
      description: "Ping the FastNEAR API for liveness — returns `{status: ok}` when healthy."
      operationId: get_health
      parameters:
        - description: Optional API key forwarded by embedded portal clients. The public FastNEAR API does not require it.
          in: query
          name: apiKey
          required: false
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              example:
                status: ok
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: Health status string
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      summary: Get service health
      tags:
        - system
servers:
  - description: Mainnet
    url: https://api.fastnear.com
  - description: Testnet
    url: https://test.api.fastnear.com
components:
  schemas:
    AccountBalanceRow:
      additionalProperties: false
      properties:
        account_id:
          type: string
        balance:
          nullable: true
          type: string
      required:
        - account_id
        - balance
      type: object
    AccountFullResponse:
      additionalProperties: false
      properties:
        account_id:
          type: string
        nfts:
          items:
            $ref: "#/components/schemas/NftRow"
          type: array
        pools:
          items:
            $ref: "#/components/schemas/PoolRow"
          type: array
        state:
          allOf:
            - $ref: "#/components/schemas/AccountStateResponse"
          nullable: true
          type: object
        tokens:
          items:
            $ref: "#/components/schemas/TokenRow"
          type: array
      required:
        - account_id
        - pools
        - tokens
        - nfts
        - state
      type: object
    AccountStateResponse:
      additionalProperties: false
      properties:
        balance:
          nullable: true
          type: string
        locked:
          nullable: true
          type: string
        storage_bytes:
          format: uint64
          minimum: 0
          nullable: true
          type: integer
      required:
        - balance
        - locked
        - storage_bytes
      type: object
    HealthResponse:
      additionalProperties: false
      properties:
        status:
          type: string
      required:
        - status
      type: object
    NftRow:
      additionalProperties: false
      properties:
        contract_id:
          type: string
        last_update_block_height:
          format: uint64
          minimum: 0
          nullable: true
          type: integer
      required:
        - contract_id
        - last_update_block_height
      type: object
    PoolRow:
      additionalProperties: false
      properties:
        last_update_block_height:
          format: uint64
          minimum: 0
          nullable: true
          type: integer
        pool_id:
          type: string
      required:
        - pool_id
        - last_update_block_height
      type: object
    PublicKeyLookupResponse:
      additionalProperties: false
      properties:
        account_ids:
          items:
            type: string
          type: array
        public_key:
          type: string
      required:
        - public_key
        - account_ids
      type: object
    StatusResponse:
      additionalProperties: false
      properties:
        sync_balance_block_height:
          format: uint64
          minimum: 0
          nullable: true
          type: integer
        sync_block_height:
          format: uint64
          minimum: 0
          nullable: true
          type: integer
        sync_block_timestamp_nanosec:
          nullable: true
          type: string
        sync_latency_sec:
          format: double
          nullable: true
          type: number
        version:
          type: string
      required:
        - version
        - sync_block_height
        - sync_latency_sec
        - sync_block_timestamp_nanosec
        - sync_balance_block_height
      type: object
    TokenAccountsResponse:
      additionalProperties: false
      properties:
        accounts:
          items:
            $ref: "#/components/schemas/AccountBalanceRow"
          type: array
        token_id:
          type: string
      required:
        - token_id
        - accounts
      type: object
    TokenRow:
      additionalProperties: false
      properties:
        balance:
          nullable: true
          type: string
        contract_id:
          type: string
        last_update_block_height:
          format: uint64
          minimum: 0
          nullable: true
          type: integer
      required:
        - contract_id
        - last_update_block_height
        - balance
      type: object
    V0ContractsResponse:
      additionalProperties: false
      properties:
        account_id:
          type: string
        contract_ids:
          items:
            type: string
          type: array
      required:
        - account_id
        - contract_ids
      type: object
    V0StakingResponse:
      additionalProperties: false
      properties:
        account_id:
          type: string
        pools:
          items:
            type: string
          type: array
      required:
        - account_id
        - pools
      type: object
    V1FtResponse:
      additionalProperties: false
      properties:
        account_id:
          type: string
        tokens:
          items:
            $ref: "#/components/schemas/TokenRow"
          type: array
      required:
        - account_id
        - tokens
      type: object
    V1NftResponse:
      additionalProperties: false
      properties:
        account_id:
          type: string
        tokens:
          items:
            $ref: "#/components/schemas/NftRow"
          type: array
      required:
        - account_id
        - tokens
      type: object
    V1StakingResponse:
      additionalProperties: false
      properties:
        account_id:
          type: string
        pools:
          items:
            $ref: "#/components/schemas/PoolRow"
          type: array
      required:
        - account_id
        - pools
      type: object
